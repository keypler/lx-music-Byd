name: Build Beta Debug APK

on:
  push:
    branches:
      - beta
  workflow_dispatch:        # 允许在 Actions 页面手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug

      - name: List generated APK files
        shell: bash
        run: |
          echo "===== APK files ====="
          find android/app/build/outputs -name "*.apk" -type f

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Generate file MD5
        shell: bash
        run: |
          cd android/app/build/outputs/apk
          find . -name "*.apk" -exec md5sum {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ env.PACKAGE_VERSION }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
